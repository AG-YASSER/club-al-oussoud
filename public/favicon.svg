<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Primary Gold/Orange Mane Gradient -->
    <linearGradient id="maneGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Face Highlights -->
    <linearGradient id="faceGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Eye Glow Filter -->
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.85" />

  <!-- Outer Majestic Lion Mane (Polygonal Geometric Cuts) -->
  <path d="
    M256 52 
    L310 102 L368 76 L384 136 L442 142 L424 204 L476 238 L430 286 L456 348 
    L394 366 L388 430 L324 416 L292 464 L256 438 L220 464 L188 416 L124 430 
    L118 366 L56 348 L82 286 L36 238 L88 204 L70 142 L128 136 L144 76 L202 102 Z" 
    fill="url(#maneGrad)" />

  <!-- Inner Dark Crest Contours -->
  <path d="
    M256 104
    L300 146 L342 130 L350 180 L394 196 L378 244 L412 274 L374 310 L388 358 
    L338 368 L328 414 L284 398 L256 422 L228 398 L184 414 L174 368 L124 358 
    L138 310 L100 274 L134 244 L118 196 L162 180 L170 130 L212 146 Z"
    fill="url(#faceGrad)" />

  <!-- Lion Crown Forehead Crest -->
  <polygon points="256,128 288,184 224,184" fill="#fb923c" />
  <polygon points="256,192 298,242 214,242" fill="#f97316" />

  <!-- Brow Ridges -->
  <polygon points="210,240 250,250 206,258" fill="#ea580c" />
  <polygon points="302,240 262,250 306,258" fill="#ea580c" />

  <!-- Glowing Intense Fierce Eyes -->
  <polygon points="186,262 232,272 200,284" fill="#fde047" filter="url(#eyeGlow)" />
  <polygon points="326,262 280,272 312,284" fill="#fde047" filter="url(#eyeGlow)" />

  <!-- Pupils -->
  <polygon points="204,268 214,272 208,278" fill="#09090b" />
  <polygon points="308,268 298,272 304,278" fill="#09090b" />

  <!-- Powerful Snout & Bridge -->
  <polygon points="256,256 278,332 234,332" fill="#fb923c" />

  <!-- Nose Tip -->
  <polygon points="256,356 280,332 232,332" fill="#ea580c" />

  <!-- Strong Muzzle & Jaws -->
  <polygon points="256,356 296,380 256,394" fill="#f97316" />
  <polygon points="256,356 216,380 256,394" fill="#f97316" />

  <!-- Chin / Beard Accent -->
  <polygon points="256,398 274,424 238,424" fill="#fb923c" />
</svg>